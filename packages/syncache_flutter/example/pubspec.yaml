name: syncache_flutter_example
description: Example app demonstrating syncache_flutter usage.
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  syncache: ^0.1.2
  syncache_flutter: ^0.1.2
  syncache_hive: ^0.5.0
  syncache_workmanager: ^0.1.0
  hive_ce_flutter: ^2.4.0
  workmanager: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Local development: resolve the sibling packages from this repository
# instead of pub.dev. Committed (rather than using a pubspec_overrides.yaml)
# so CI and `flutter pub publish` resolve the example without melos.
dependency_overrides:
  syncache:
    path: ../../syncache
  syncache_flutter:
    path: ..
  syncache_hive:
    path: ../../syncache_hive
  syncache_workmanager:
    path: ../../syncache_workmanager

flutter:
  uses-material-design: true
