name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syncache:
    name: syncache (core, Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/syncache
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: dart analyze --fatal-infos lib test

      - name: Run tests
        run: dart test

  syncache_hive:
    name: syncache_hive (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/syncache_hive
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: dart analyze --fatal-infos lib test

      - name: Run tests
        run: dart test

  syncache_drift:
    name: syncache_drift (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/syncache_drift
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # The generated part file is committed; verify build_runner is a no-op.
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test example

      - name: Analyze
        run: dart analyze --fatal-infos lib test example

      - name: Run tests
        run: dart test

  docs:
    name: README code samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Validate README samples
        run: dart run tool/validate_readme_samples.dart

  syncache_flutter:
    name: syncache_flutter (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/syncache_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test

      - name: Example app — install dependencies
        run: flutter pub get
        working-directory: packages/syncache_flutter/example

      - name: Example app — check formatting
        run: dart format --set-exit-if-changed lib
        working-directory: packages/syncache_flutter/example

      - name: Example app — analyze
        run: flutter analyze lib
        working-directory: packages/syncache_flutter/example

  syncache_workmanager:
    name: syncache_workmanager (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/syncache_workmanager
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test
