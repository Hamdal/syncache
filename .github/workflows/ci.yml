name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syncache:
    name: syncache (core, Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/syncache
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: dart analyze --fatal-infos lib test

      - name: Run tests
        run: dart test

  syncache_hive:
    name: syncache_hive (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/syncache_hive
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: dart analyze --fatal-infos lib test

      - name: Run tests
        run: dart test

  syncache_flutter:
    name: syncache_flutter (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/syncache_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test
